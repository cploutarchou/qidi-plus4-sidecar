services:
  # go2rtc - WebRTC streaming with hardware acceleration
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: qidi_go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555"
    networks:
      - qidi_network
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:/dev/video0
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    environment:
      - TZ=${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:1984/api",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.qidi.service=streaming"
      - "com.qidi.description=WebRTC streaming with hardware acceleration"

  # Moonraker Prometheus Exporter
  moonraker-exporter:
    image: ghcr.io/scross01/prometheus-klipper-exporter:latest
    container_name: qidi_moonraker_exporter
    restart: unless-stopped
    ports:
      - "9101:9101"
    networks:
      - qidi_network
    environment:
      - KLIPPER_EXPORTER_MOONRAKER_HOST=${PRINTER_IP:-192.168.68.35}
      - KLIPPER_EXPORTER_MOONRAKER_PORT=7125
      - TZ=${TZ:-UTC}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64M
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9101/metrics",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.qidi.service=monitoring"
      - "com.qidi.description=Prometheus metrics exporter for Moonraker"

  # External UI - Much faster than the printer's internal web server
  mainsail:
    image: ghcr.io/mainsail-crew/mainsail:latest
    container_name: qidi_mainsail
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - qidi_network
    volumes:
      - ./mainsail/config.json:/usr/share/nginx/html/config.json:rw
      - ./mainsail/nginx/default.conf:/etc/nginx/conf.d/default.conf.template:ro
      - ./docker/mainsail-entrypoint.sh:/docker-entrypoint.sh:ro
    environment:
      - PRINTER_IP=${PRINTER_IP:-192.168.68.35}
      - HOST_IP=${HOST_IP:-192.168.68.26}
      - CAMERA_MODE=${CAMERA_MODE:-unknown}
      - TZ=${TZ:-UTC}
    entrypoint: /docker-entrypoint.sh
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.qidi.service=ui"
      - "com.qidi.description=Mainsail web interface for printer control"

  # Moonraker-Obico - AI failure detection for Klipper printers
  moonraker-obico:
    image: ghcr.io/thespaghettidetective/moonraker-obico:latest
    container_name: qidi_moonraker_obico
    restart: unless-stopped
    networks:
      - qidi_network
    volumes:
      - ./obico/moonraker-obico:/app/moonraker-obico
      - ./obico/moonraker-obico.cfg:/opt/printer_data/config/moonraker-obico.cfg:rw
    environment:
      - TZ=${TZ:-UTC}
      - MOONRAKER_HOST=${PRINTER_IP:-192.168.68.35}
      - MOONRAKER_PORT=7125
      - OBICO_SERVER_URL=https://app.obico.io
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f moonraker-obico || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.qidi.service=monitoring"
      - "com.qidi.description=AI-powered print failure detection"

networks:
  qidi_network:
    name: qidi_plus4_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
