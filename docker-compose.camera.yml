# docker-compose.camera.yml
# Use this file when you have a USB camera connected
# Usage: docker compose -f docker-compose.yml -f docker-compose.camera.yml up -d

services:
  go2rtc:
    # Override to enable camera support
    profiles: []
    devices:
      - /dev/video0:/dev/video0 # Change to your camera device
      # To find your camera device, run: ls -la /dev/video*
      # Common alternatives: /dev/video1, /dev/video2
      - /dev/dri:/dev/dri
    volumes:
      - /dev/v4l:/dev/v4l:ro
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
